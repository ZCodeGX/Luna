<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-labelledby="title">
  <title id="title">Luna</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="160" height="160" fill="black"/>
      <circle cx="72" cy="80" r="44" fill="white"/>
      <circle cx="92" cy="62" r="40" fill="black"/>
    </mask>
  </defs>
  <rect width="640" height="160" rx="18" fill="url(#bg)"/>
  <circle cx="72" cy="80" r="44" fill="url(#moon)" mask="url(#crescent)"/>
  <text x="150" y="102" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="2">Luna</text>
</svg>
